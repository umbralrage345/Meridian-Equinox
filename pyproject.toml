[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.1.0"
description = "Simulation package for the Meridian fictional space probe workshop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "astropy",
    "ipython",
    "nbformat",
]

[project.optional-dependencies]
torch = [
    "torch",
]
dev = [
    "pytest",
    "nbconvert",
    "ipykernel",
    "psutil",
]
notebook = [
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["meridian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
